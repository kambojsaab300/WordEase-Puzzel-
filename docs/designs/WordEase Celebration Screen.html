<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WordEase Celebration Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: level-complete celebration. Ocean burst with golden rays, extruded 3D title, glossy 3D stars, tilted postcard that paints to colour, confetti + coin shower, two 3D buttons, banner ad slot */
[hidden]{display:none!important}
:root{--bg:#EDF1F3;--fg:#1F2A37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181E;--fg:#E7EDF1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181E;--fg:#E7EDF1;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:"Nunito",ui-rounded,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.phone{width:min(390px,100%);margin:0 auto;background:#0B1116;border-radius:46px;padding:10px;box-sizing:border-box;box-shadow:0 24px 60px rgba(10,30,45,.28)}
.screen{position:relative;aspect-ratio:390/844;border-radius:36px;overflow:hidden;container-type:inline-size;background:radial-gradient(circle at 50% 34%,#33B2D6 0%,#0E6E8C 40%,#07344B 100%);color:#FFFFFF;--u:calc(100cqw/390)}
button{font-family:inherit}
button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.defs{position:absolute;width:0;height:0}
.rays{position:absolute;left:50%;top:calc(var(--u)*270);width:calc(var(--u)*980);height:calc(var(--u)*980);margin:calc(var(--u)*-490) 0 0 calc(var(--u)*-490);background:repeating-conic-gradient(rgba(255,228,120,.30) 0 7.5deg,rgba(255,228,120,0) 7.5deg 15deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 50s linear infinite}
.glow{position:absolute;left:50%;top:calc(var(--u)*270);width:calc(var(--u)*520);height:calc(var(--u)*520);margin:calc(var(--u)*-260) 0 0 calc(var(--u)*-260);border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.55),rgba(255,240,170,0) 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{position:absolute;width:calc(var(--u)*22);height:calc(var(--u)*22);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.lv{position:absolute;top:calc(var(--u)*22);left:50%;transform:translateX(-50%);height:calc(var(--u)*34);padding:0 calc(var(--u)*18);border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 calc(var(--u)*1.5) rgba(255,255,255,.4);font-weight:800;font-size:calc(var(--u)*17);letter-spacing:.04em;white-space:nowrap}
.title{position:absolute;top:calc(var(--u)*66);left:calc(var(--u)*12);width:calc(var(--u)*366);height:auto;overflow:visible}
.stars{position:absolute;top:calc(var(--u)*176);left:0;width:100%;height:calc(var(--u)*160);perspective:calc(var(--u)*700)}
.st{position:absolute;display:block;transform:rotate(var(--r));filter:drop-shadow(0 calc(var(--u)*8) calc(var(--u)*7) rgba(0,30,45,.4))}
.st svg{display:block;width:100%;height:auto}
.st::before{content:"";position:absolute;left:10%;right:10%;top:6%;bottom:16%;border-radius:50%;border:calc(var(--u)*4) solid rgba(255,240,170,.95);opacity:0}
.s0{width:calc(var(--u)*84);left:calc(var(--u)*62);top:calc(var(--u)*46);--r:-14deg}
.s1{width:calc(var(--u)*118);left:calc(var(--u)*136);top:0;--r:0deg}
.s2{width:calc(var(--u)*84);left:calc(var(--u)*244);top:calc(var(--u)*46);--r:14deg}
.pc{position:absolute;top:calc(var(--u)*350);left:50%;width:calc(var(--u)*312);margin-left:calc(var(--u)*-156);perspective:calc(var(--u)*900)}
.card{position:relative;padding:calc(var(--u)*8);border-radius:calc(var(--u)*10);background:#FFFDF6;overflow:hidden;transform:rotateX(9deg) rotateY(-11deg) rotateZ(-1.5deg);box-shadow:0 calc(var(--u)*1) 0 #DDD4BF,0 calc(var(--u)*2) 0 #D3C9B2,0 calc(var(--u)*3) 0 #C9BFA6,0 calc(var(--u)*4) 0 #BFB59B,0 calc(var(--u)*5) 0 #B5AB91,0 calc(var(--u)*22) calc(var(--u)*24) rgba(0,25,40,.5);animation:sway 4s ease-in-out 2.8s infinite alternate}
.card img{display:block;width:100%;height:auto;border-radius:calc(var(--u)*4)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);transform:translateX(-130%);pointer-events:none}
@keyframes sway{from{transform:rotateX(9deg) rotateY(-11deg) rotateZ(-1.5deg)}to{transform:rotateX(7deg) rotateY(-4deg) rotateZ(-1deg)}}
.coin{position:absolute;top:calc(var(--u)*534);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*10)}
.coin svg{width:calc(var(--u)*46);height:auto;filter:drop-shadow(0 calc(var(--u)*4) calc(var(--u)*4) rgba(0,30,45,.35))}
.num{font-weight:900;font-size:calc(var(--u)*46);line-height:1;color:#FFE27A;text-shadow:0 calc(var(--u)*1) 0 #C2631A,0 calc(var(--u)*2) 0 #C2631A,0 calc(var(--u)*3) 0 #B8561A,0 calc(var(--u)*4) 0 #B8561A,0 calc(var(--u)*5) 0 #A64B10,0 calc(var(--u)*6) 0 #A64B10,0 calc(var(--u)*14) calc(var(--u)*10) rgba(0,25,40,.4)}
.btn{position:absolute;left:calc(var(--u)*45);width:calc(var(--u)*300);border:0;border-radius:calc(var(--u)*20);color:#FFFFFF;font-weight:900;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*10);cursor:pointer;text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);transition:transform .08s}
.btn svg{width:calc(var(--u)*24);height:calc(var(--u)*24)}
.btn.coral{top:calc(var(--u)*610);height:calc(var(--u)*56);font-size:calc(var(--u)*22);background:linear-gradient(#FF8C6E,#E5482C);box-shadow:0 calc(var(--u)*6) 0 #9E2C17,0 calc(var(--u)*12) calc(var(--u)*16) rgba(0,25,40,.35),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.5)}
.btn.green{top:calc(var(--u)*682);height:calc(var(--u)*62);font-size:calc(var(--u)*27);background:linear-gradient(#3CC45C,#178A38);box-shadow:0 calc(var(--u)*6) 0 #0F5F26,0 calc(var(--u)*12) calc(var(--u)*16) rgba(0,25,40,.35),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(calc(var(--u)*4))}
.ad{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*16);width:calc(var(--u)*320);height:calc(var(--u)*50);box-sizing:border-box;border:1px dashed rgba(255,255,255,.5);border-radius:calc(var(--u)*6);background:rgba(7,52,75,.55);color:rgba(255,255,255,.8);font-weight:800;font-size:calc(var(--u)*14);display:grid;place-items:center}
.fall{position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;perspective:calc(var(--u)*600)}
.cf{position:absolute;top:calc(var(--u)*-30);width:calc(var(--u)*11);height:calc(var(--u)*17);border-radius:2px;animation:cf var(--t) cubic-bezier(.3,.5,.6,1) var(--d) both}
@keyframes cf{to{transform:translate3d(var(--x),calc(var(--u)*900),0) rotateX(1080deg) rotateZ(540deg)}}
.cn{position:absolute;top:calc(var(--u)*-40);width:calc(var(--u)*28);animation:cn var(--t) cubic-bezier(.3,.5,.6,1) var(--d) both}
.cn svg{display:block;width:100%;height:auto}
@keyframes cn{to{transform:translate3d(var(--x),calc(var(--u)*900),0) rotateY(1260deg)}}
.adfull{position:absolute;inset:0;z-index:30;background:#1F2A37;display:grid;place-items:center}
.adbox{width:calc(var(--u)*300);height:calc(var(--u)*440);box-sizing:border-box;border:2px dashed #6E7B8A;border-radius:calc(var(--u)*16);display:grid;place-items:center;color:#C4CCD4;font-weight:800;font-size:calc(var(--u)*22)}
.adtag{position:absolute;top:calc(var(--u)*24);left:calc(var(--u)*20);background:#F5C842;color:#1F2A37;font-weight:800;font-size:calc(var(--u)*13);padding:calc(var(--u)*4) calc(var(--u)*10);border-radius:6px}
.cd,.adx{position:absolute;top:calc(var(--u)*16);right:calc(var(--u)*18);width:calc(var(--u)*44);height:calc(var(--u)*44);box-sizing:border-box;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*18)}
.cd{border:2px solid #C4CCD4;color:#C4CCD4}
.adx{border:0;padding:0;background:#FFFFFF;color:#1F2A37;cursor:pointer}
.adx svg{width:50%;height:50%}
.replay{display:block;margin:18px auto 0;padding:10px 22px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:var(--fg);font-weight:800;font-size:16px;cursor:pointer}

/* Entrance timeline: only while .go is set, so the final state is the base style (also what reduced-motion sees) */
.go .glow{animation:fade .8s ease both}
.go .lv{animation:fade .5s ease .1s both}
.go .title{animation:drop .8s cubic-bezier(.2,1.5,.4,1) .15s both}
.go .st{animation:pop .75s cubic-bezier(.2,1.2,.4,1) var(--d) both}
.go .st::before{animation:ring .7s ease-out calc(var(--d) + .3s) both}
.go .s0{--d:.8s}.go .s1{--d:1.15s}.go .s2{--d:1.5s}
.go .pc{animation:rise .8s cubic-bezier(.2,1.2,.4,1) .6s both}
.go .card img{animation:paint 1.3s ease-in-out 1.7s both}
.go .card::after{animation:shine 1s ease-in-out 3s both}
.go .coin{animation:rise .6s ease 2.1s both}
.go .btn.coral{animation:rise .6s ease 2.5s both}
.go .btn.green{animation:rise .6s ease 2.7s both}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translateY(calc(var(--u)*-40)) scale(1.6);opacity:0}}
@keyframes pop{0%{transform:rotate(var(--r)) scale(0) rotateY(-220deg);opacity:0}55%{transform:rotate(var(--r)) scale(1.3) rotateY(20deg);opacity:1}100%{transform:rotate(var(--r)) scale(1) rotateY(0)}}
@keyframes ring{0%{transform:scale(.4);opacity:0}20%{opacity:.95}100%{transform:scale(2);opacity:0}}
@keyframes rise{from{transform:translateY(calc(var(--u)*30));opacity:0}}
@keyframes paint{from{filter:grayscale(1) brightness(.92)}}
@keyframes shine{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){.rays,.sp,.card,.go .glow,.go .lv,.go .title,.go .st,.go .st::before,.go .pc,.go .card img,.go .card::after,.go .coin,.go .btn{animation:none}.sp{opacity:.8;transform:none}.fall{display:none}}
</style>

    <div class="coin"><svg viewBox="0 0 40 46" aria-hidden="true"><circle cx="20" cy="26" r="18" fill="#B25F00"/><circle cx="20" cy="20" r="18" fill="url(#gCF)" stroke="#E8920A" stroke-width="2"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="#D98A00" stroke-width="3"/><path d="M8.5 15a12.5 12.5 0 0 1 8.5-7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity=".85"/></svg><span class="num" id="cv">+20</span></div>
    <button type="button" class="btn coral" id="dbl" aria-label="Watch an ad to double your coins"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Double coins</button>
    <button type="button" class="btn green" id="next">Next level</button>
    <div class="fall" id="fall" aria-hidden="true"></div>
    <p class="sr" aria-live="polite" id="live"></p>
    <div class="ad"><span>Ad banner</span></div>
    <div class="adfull" id="adf" hidden>
      <span class="adtag">Ad</span><div class="adbox">Test ad</div><span class="cd" id="cd" aria-live="polite"></span>
      <button type="button" class="adx" id="adx" aria-label="Close ad" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>
<button type="button" class="replay" id="re">Replay</button>

<script>
const $=id=>document.getElementById(id),scr=$('scr');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,rnd=(a,b)=>a+Math.random()*(b-a);
const U=()=>scr.getBoundingClientRect().width/390;
/* 3D title: stacked copies give the extrusion depth */
$('ext').innerHTML=Array.from({length:11},(_,i)=>`<use href="#tt" y="${i}"/>`).join('');
$('ext2').innerHTML=Array.from({length:9},(_,i)=>`<use href="#tt" y="${i+1}"/>`).join('');
const pts=(R,r)=>[...Array(10)].map((_,i)=>{const a=(-90+i*36)*Math.PI/180,k=i%2?r:R;return(50+k*Math.cos(a)).toFixed(1)+','+(52+k*Math.sin(a)).toFixed(1)}).join(' ');
const star=on=>`<svg viewBox="0 0 100 112" aria-hidden="true"><polygon points="${pts(44,22)}" transform="translate(0,9)" fill="${on?'#B25F00':'#5E6B76'}" stroke="${on?'#B25F00':'#5E6B76'}" stroke-width="9" stroke-linejoin="round"/><polygon points="${pts(44,22)}" fill="url(#${on?'gSF':'gGF'})" stroke="${on?'#F0A000':'#8794A0'}" stroke-width="9" stroke-linejoin="round"/><polygon points="${pts(27,13.5)}" fill="url(#${on?'gSB':'gGB'})" stroke="${on?'#FFB000':'#9AA7B1'}" stroke-width="2" stroke-linejoin="round"/><ellipse cx="36" cy="33" rx="7" ry="3.6" transform="rotate(-38 36 33)" fill="#FFFFFF" opacity="${on?.8:.5}"/></svg>`;
const coinSvg=`<svg viewBox="0 0 40 46" aria-hidden="true"><circle cx="20" cy="26" r="18" fill="#B25F00"/><circle cx="20" cy="20" r="18" fill="url(#gCF)" stroke="#E8920A" stroke-width="2"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="#D98A00" stroke-width="3"/><path d="M8.5 15a12.5 12.5 0 0 1 8.5-7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity=".85"/></svg>`;
let n=3,coins=20,onAd=null,sinceAd=0,timers=[];
function setStars(k){n=k;$('stars').innerHTML=[0,1,2].map(i=>`<span class="st s${i}">${star(i<k)}</span>`).join('');$('stars').setAttribute('aria-label',`${k} of 3 stars`)}
function count(to,from,ms){const el=$('cv');if(RM){el.textContent='+'+to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms);el.textContent='+'+Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function burst(count_,coinsN,delay){if(RM)return;const f=$('fall'),u=U(),cs=['#FF5A5F','#FFD23F','#3CC45C','#4DB6FF','#FF8FD0','#FFFFFF','#FF9A3C'];
  for(let k=0;k<count_;k++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${rnd(2,98)}%;background:${cs[k%cs.length]};--x:${rnd(-60,60)*u}px;--t:${rnd(2.2,3.6)}s;--d:${delay+rnd(0,.9)}s;rotate:${rnd(0,180)}deg`;f.append(s)}
  for(let k=0;k<coinsN;k++){const s=document.createElement('span');s.className='cn';s.innerHTML=coinSvg;s.style.cssText=`left:${rnd(4,92)}%;--x:${rnd(-40,40)*u}px;--t:${rnd(2.4,3.4)}s;--d:${delay+rnd(0,1.1)}s`;f.append(s)}}
function play(k){timers.forEach(clearTimeout);timers=[];$('fall').innerHTML='';coins=20;$('cv').textContent='+20';$('dbl').hidden=false;setStars(k);
  scr.classList.remove('go');void scr.offsetWidth;scr.classList.add('go');
  burst(46,10,.3);timers.push(setTimeout(()=>burst(30,6,0),1600));
  if(!RM){$('cv').textContent='+0';timers.push(setTimeout(()=>count(20,0,800),2200))}
  $('live').textContent=`Congratulations! Level complete. ${k} of 3 stars. 20 coins.`}
function showAd(sec,done){$('adf').hidden=false;$('adx').hidden=true;$('cd').hidden=false;let t=sec;$('cd').textContent=t;onAd=done;
  const iv=setInterval(()=>{t--;$('cd').textContent=t;if(t<=0){clearInterval(iv);$('cd').hidden=true;$('adx').hidden=false;$('adx').focus()}},1000)}
$('adx').onclick=()=>{$('adf').hidden=true;const f=onAd;onAd=null;f&&f()};
$('dbl').onclick=()=>showAd(5,()=>{$('dbl').hidden=true;count(40,20,700);$('live').textContent='Coins doubled to 40.';$('next').focus()});
$('next').onclick=()=>{if(++sinceAd>=3){sinceAd=0;showAd(3,()=>play(3))}else play(3)};
$('re').onclick=()=>play(3);
play(3);
</script>
