<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WordEase Level Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one phone mockup. Inside: a paper-cutout World Trip map that is painted below the current level and pencil-grey above it. */
[hidden]{display:none!important}
:root{--bg:#EDF1F3;--fg:#1F2A37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181E;--fg:#E7EDF1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181E;--fg:#E7EDF1;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:"Nunito",ui-rounded,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.phone{width:min(390px,100%);margin:0 auto;background:#0B1116;border-radius:46px;padding:10px;box-sizing:border-box;box-shadow:0 24px 60px rgba(10,30,45,.28)}
.screen{position:relative;aspect-ratio:390/844;border-radius:36px;overflow:hidden;container-type:inline-size;background:#C9E3AE;--u:calc(100cqw/390)}
button{font-family:inherit}
button:focus-visible{outline:3px solid #1F2A37;outline-offset:3px}
.map{position:absolute;inset:0 0 calc(var(--u)*62) 0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.land{position:relative}
.world{position:relative;height:calc(var(--u)*4660)}
.terrain{position:absolute;inset:0;width:100%;height:100%}
.edge{position:absolute;left:0;bottom:calc(var(--u)*-30);width:100%;height:calc(var(--u)*40);z-index:1}
.sketch{position:absolute;left:-4px;right:-4px;top:0;z-index:40;pointer-events:none;-webkit-backdrop-filter:grayscale(1) contrast(.9) brightness(1.06);backdrop-filter:grayscale(1) contrast(.9) brightness(1.06);-webkit-mask-image:linear-gradient(to top,transparent,#000 calc(var(--u)*200));mask-image:linear-gradient(to top,transparent,#000 calc(var(--u)*200))}
.card{position:absolute;left:calc(var(--u)*45);bottom:calc(var(--u)*76);width:calc(var(--u)*300);transform:rotate(-2deg);z-index:2}
.card img{width:100%;display:block;box-sizing:border-box;border:calc(var(--u)*7) solid #FFFDF7;border-radius:calc(var(--u)*10);box-shadow:0 calc(var(--u)*8) calc(var(--u)*18) rgba(60,40,20,.28)}
.tape{position:absolute;top:calc(var(--u)*-12);left:calc(var(--u)*104);width:calc(var(--u)*92);height:calc(var(--u)*26);background:rgba(255,255,255,.6);transform:rotate(4deg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stamp{position:absolute;z-index:1;top:calc(var(--u)*-20);right:calc(var(--u)*-14);width:calc(var(--u)*58);height:calc(var(--u)*58);box-sizing:border-box;border-radius:50%;background:#FFF8EC;color:#0E6E8C;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*24);border:calc(var(--u)*3) solid #0E6E8C;box-shadow:inset 0 0 0 calc(var(--u)*3) #FFF8EC,inset 0 0 0 calc(var(--u)*4.5) #0E6E8C;transform:rotate(12deg)}
.tag{position:absolute;left:50%;bottom:calc(var(--u)*-20);transform:translateX(-50%) rotate(3deg);background:#1F2A37;color:#FFF8EC;font-weight:800;font-size:calc(var(--u)*19);padding:calc(var(--u)*6) calc(var(--u)*18);border-radius:calc(var(--u)*8);white-space:nowrap;box-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.22)}
.n{position:absolute;z-index:3;width:calc(var(--u)*56);height:calc(var(--u)*56);margin:calc(var(--u)*-28) 0 0 calc(var(--u)*-28);border-radius:50%;border:calc(var(--u)*4) solid #FFFDF7;font-weight:800;font-size:calc(var(--u)*20);line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 calc(var(--u)*5) 0 rgba(31,42,55,.28)}
.done{background:#0E6E8C;color:#FFFFFF}
.lock{background:#EAE4DA;color:#5E574D}
.end{border-color:#F5C842;border-width:calc(var(--u)*6)}
.cur{z-index:4;background:#F2785C;color:#1F2A37;width:calc(var(--u)*74);height:calc(var(--u)*74);margin:calc(var(--u)*-37) 0 0 calc(var(--u)*-37);font-size:calc(var(--u)*26);animation:pulse 1.8s ease-out infinite}
.st{position:absolute;top:100%;left:50%;transform:translate(-50%,calc(var(--u)*2));font-size:calc(var(--u)*13);letter-spacing:calc(var(--u)*1);color:#F5B700;text-shadow:0 1px 0 #7A5A00;white-space:nowrap}
.balloon{position:absolute;left:50%;bottom:100%;width:calc(var(--u)*48);height:calc(var(--u)*74);margin-left:calc(var(--u)*-12);transform:translateY(calc(var(--u)*-2));animation:bob 3.2s ease-in-out infinite}
.n.done,.n.lock,.n.cur{background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.3),transparent 56%)}
@keyframes bob{50%{translate:0 calc(var(--u)*-7)}}
.shake{animation:shake .4s}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(242,120,92,.65),0 calc(var(--u)*5) 0 rgba(31,42,55,.28)}to{box-shadow:0 0 0 calc(var(--u)*22) rgba(242,120,92,0),0 calc(var(--u)*5) 0 rgba(31,42,55,.28)}}
@keyframes shake{25%{translate:calc(var(--u)*-6) 0}75%{translate:calc(var(--u)*6) 0}}
.top{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*8);padding:calc(var(--u)*14) calc(var(--u)*14) calc(var(--u)*10);background:rgba(255,253,247,.92);backdrop-filter:blur(6px);box-shadow:0 1px 0 rgba(31,42,55,.1)}
.coins{display:flex;align-items:center;gap:calc(var(--u)*6);height:calc(var(--u)*44);padding:0 calc(var(--u)*14) 0 calc(var(--u)*6);background:#FFFFFF;border-radius:999px;font-weight:800;font-size:calc(var(--u)*18);color:#1F2A37;box-shadow:inset 0 0 0 1px rgba(31,42,55,.12)}
.coins svg{width:calc(var(--u)*32);height:calc(var(--u)*32)}
.wchip{display:flex;align-items:center;gap:calc(var(--u)*8);height:calc(var(--u)*44);padding:0 calc(var(--u)*14) 0 calc(var(--u)*5);background:#FFFFFF;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(31,42,55,.12);min-width:0}
.wchip b{width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;background:#0E6E8C;color:#FFF8EC;display:grid;place-items:center;font-size:calc(var(--u)*16)}
.wchip>span{display:flex;flex-direction:column;gap:calc(var(--u)*4);font-weight:800;font-size:calc(var(--u)*17);line-height:1;color:#1F2A37;white-space:nowrap}
.bar{display:block;width:calc(var(--u)*90);height:calc(var(--u)*6);border-radius:9px;background:#E8DFD0;overflow:hidden}
.bar i{display:block;height:100%;background:#F2785C;border-radius:9px;transition:width .3s}
.ib{width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:50%;border:0;background:#0E6E8C;color:#FFF8EC;display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:55%;height:55%}
.jump{position:absolute;right:calc(var(--u)*14);bottom:calc(var(--u)*150);z-index:50;width:calc(var(--u)*56);height:calc(var(--u)*56);box-shadow:0 calc(var(--u)*4) calc(var(--u)*12) rgba(31,42,55,.3)}
.ad{position:absolute;left:0;right:0;bottom:0;z-index:50;height:calc(var(--u)*62);background:#FFFDF7;display:grid;place-items:center;box-shadow:0 -1px 0 rgba(31,42,55,.12)}
.ad span{width:calc(var(--u)*320);height:calc(var(--u)*50);box-sizing:border-box;border:1.5px dashed #B9B2A6;border-radius:calc(var(--u)*6);display:grid;place-items:center;font-weight:700;font-size:calc(var(--u)*12);color:#5E574D}
.sheet{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.back{position:absolute;inset:0;border:0;padding:0;background:rgba(15,25,35,.5);cursor:pointer}
.box{position:relative;background:#FFFDF7;border-radius:calc(var(--u)*28) calc(var(--u)*28) 0 0;padding:calc(var(--u)*20) calc(var(--u)*20) calc(var(--u)*40);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);animation:slide .25s ease-out}
.box img{width:100%;display:block;border-radius:calc(var(--u)*14)}
.box h2{margin:0;font-weight:800;font-size:calc(var(--u)*34);color:#1F2A37}
.stars{font-size:calc(var(--u)*30);letter-spacing:calc(var(--u)*4);color:#F5B700}.stars i{font-style:normal;color:#D9CFBF}
.play{width:100%;height:calc(var(--u)*64);border:0;border-radius:999px;background:#F2785C;color:#1F2A37;font-weight:800;font-size:calc(var(--u)*26);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*10);cursor:pointer;box-shadow:0 calc(var(--u)*5) 0 #C9573E}
.play svg{width:calc(var(--u)*26);height:calc(var(--u)*26)}
.x{position:absolute;top:calc(var(--u)*28);right:calc(var(--u)*28);background:rgba(255,253,247,.95);color:#1F2A37}
@keyframes slide{from{transform:translateY(40%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.cur,.box,.shake,.balloon{animation:none}}
</style>

  <div class="screen">

      </div>
    </div>
  </div>
</div>

 berg:(c,m)=>`<path d="M-24 0L-13 -32L0 -44L15 -26L24 0Z" fill="${m||'#FFFFFF'}"/><path d="M0 -44L15 -26L24 0H4Z" fill="${c}"/>`,
 rock:c=>`<path d="M-20 0Q-18 -22 0 -24Q18 -22 20 0Z" fill="${c}"/><path d="M0 -24Q18 -22 20 0H4Q8 -14 0 -24Z" fill="#000" opacity=".12"/>`};
const POND={reeds:'<path d="M44 0v-18M48 2v-14M52 0v-20M-50 2v-16M-46 0v-12" stroke="#4E8A4E" stroke-width="3" stroke-linecap="round"/>',
 boat:'<path d="M6 8H38L32 16H12Z" fill="#8A5A34"/><path d="M20 8V-14L34 6Z" fill="#FFFDF6"/>',
 lotus:'<ellipse cx="-24" cy="6" rx="10" ry="5" fill="#5E9A5E"/><ellipse cx="18" cy="8" rx="9" ry="4.5" fill="#5E9A5E"/><circle cx="-24" cy="3" r="5" fill="#F39BB4"/><circle cx="20" cy="4" r="4" fill="#F7B7C8"/>',
 bridge:'<path d="M-40 4Q0 -26 40 4" stroke="#D2453B" stroke-width="7" fill="none"/><path d="M-30 -4V6M-15 -9V6M0 -11V6M15 -9V6M30 -4V6" stroke="#D2453B" stroke-width="3"/>',
 steam:'<path d="M-14 -8q6 -8 0 -16t0 -16M6 -8q6 -8 0 -16t0 -16" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>',
 peng:[44,30].map((x,k)=>`<g transform="translate(${x} ${-8+k*5})"><ellipse rx="6" ry="10" fill="#1F2A37"/><ellipse cx="1.5" cy="2" rx="4" ry="7" fill="#FFFFFF"/><circle cy="-10" r="4.5" fill="#1F2A37"/></g>`).join(''),
 canoe:'<path d="M-8 4Q12 14 32 4Q12 8 -8 4Z" fill="#D2453B"/>',
 palms:`<g transform="translate(-52 4) scale(.75)">${PROP.palm('#3F8F5A')}</g><g transform="translate(52 2) scale(.65)">${PROP.palm('#2F7F4A')}</g>`};
const feat=f=>{if(f[0]==='pond')return `<ellipse cy="7" rx="62" ry="30" fill="#3C2814" opacity=".14"/><ellipse rx="62" ry="30" fill="#EADFC6"/><ellipse rx="54" ry="24" fill="#7FC4D8"/><ellipse cx="-16" cy="-7" rx="22" ry="5" fill="#FFFFFF" opacity=".35"/>${POND[f[1]]}`;
 if(f[0]==='adobe')return `<ellipse cy="4" rx="34" ry="8" fill="#3C2814" opacity=".14"/><rect x="-24" y="-34" width="48" height="36" fill="${f[1]}"/><rect x="-24" y="-34" width="48" height="6" fill="#FFFFFF" opacity=".35"/><rect x="8" y="-34" width="16" height="36" fill="#000" opacity=".08"/><path d="M-7 2V-12Q0 -20 7 -12V2Z" fill="#2F5E9E"/><rect x="-19" y="-24" width="9" height="9" fill="#4A3424"/>`;
 return `<ellipse cy="4" rx="34" ry="8" fill="#3C2814" opacity=".14"/><rect x="-24" y="-30" width="48" height="32" fill="${f[2]}"/><rect x="8" y="-30" width="16" height="32" fill="#000" opacity=".08"/><path d="M-30 -28L0 -54L30 -28Z" fill="${f[1]}"/><path d="M0 -54L30 -28H0Z" fill="#000" opacity=".1"/><rect x="-6" y="-14" width="12" height="16" fill="#6B3A2C"/><rect x="-19" y="-24" width="9" height="9" fill="#8FB7C9"/>`};
const SH='#3C2814',CUR=382,PER=60,H=4660,u=v=>`calc(var(--u)*${v})`,stars=n=>(n*7919)%3+1;
const PIN='<svg class="balloon" viewBox="0 0 60 92" aria-hidden="true"><path d="M30 2C14 2 4 14 4 28c0 14 12 24 20 34h12c8-10 20-20 20-34C56 14 46 2 30 2Z" fill="#F2785C"/><path d="M30 2C22 2 17 14 17 28c0 14 5 24 9 34h8c4-10 9-20 9-34C43 14 38 2 30 2Z" fill="#F5C842"/><path d="M30 2C27 2 25 14 25 28c0 14 2 24 3 34h4c1-10 3-20 3-34C35 14 33 2 30 2Z" fill="#0E6E8C"/><ellipse cx="16" cy="22" rx="4" ry="9" fill="#FFFFFF" opacity=".35"/><path d="M24 62L25 74M36 62L35 74" stroke="#5A4030" stroke-width="1.6"/><rect x="23" y="73" width="14" height="12" rx="2" fill="#A7774E"/><rect x="23" y="73" width="14" height="3" fill="#8C5F3A"/></svg>';
const $=id=>document.getElementById(id),map=$('map'),land=$('land');
const gray=w=>CUR>(w+1)*PER?0:CUR<=w*PER?1:+(1-(CUR-w*PER-1)/PER).toFixed(2);
const doneIn=w=>Math.max(0,Math.min(PER,CUR-1-w*PER));
function terrain(w,d,pts,ph){const [,p,props]=T[w];let s=w*9973+7,o='',sh='',tu='',fe='',pr='',ps='';const r=()=>(s=s*16807%2147483647)/2147483647,busy=[];
  const put=(k,c,x,y,sc)=>{ps+=`<g transform="translate(${(x+2).toFixed(0)} ${(y+4).toFixed(0)}) scale(${sc})">${PROP[k](SH,SH)}</g>`;pr+=`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${sc})">${PROP[k](c)}</g>`};
  for(let k=0;k<10;k++){const x=k%2?330+r()*80:-20+r()*60,y=150+r()*(H-520),R=40+r()*36;
    for(const [dx,dy,f] of [[0,0,1],[R*.8,R*.25,.8],[-R*.7,R*.35,.75],[R*.1,-R*.6,.7]]){const cx=(x+dx).toFixed(0),cy=(y+dy).toFixed(0),rr=(R*f).toFixed(0);sh+=`<circle cx="${cx}" cy="${+cy+6}" r="${rr}"/>`;o+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${p}"/>`}}
  for(let k=0;k<80;k++){const x=(r()*390).toFixed(0),y=(100+r()*(H-450)).toFixed(0);tu+=`M${x} ${y}l-3 -7M${x} ${y}l0 -9M${x} ${y}l3 -7`}
  let alt=0;for(let i=1;i<PER-1;i++){const a=Math.abs(ph(i));if(a<.8||a<Math.abs(ph(i-1))||a<Math.abs(ph(i+1)))continue;const side=ph(i)>0?-1:1,x=195+side*100,y=pts[i][1];if(y>H-470)continue;busy.push([side,y]);
    if(alt++%2===0)fe+=`<g transform="translate(${x} ${y})">${feat(F[w][(alt>>1)%2])}</g>`;
    else for(const dx of [-26,24]){const [k,c]=props[r()<.5?0:1];put(k,c,x+dx,y+12+r()*20,(1+r()*.3).toFixed(2))}}
  for(let y=150;y<H-430;y+=104)for(const side of [0,1]){if(r()<.28)continue;const [k,c]=props[r()<.6?0:1],x=side?346+r()*30:14+r()*30,yy=y+r()*60,sc=(.8+r()*.35).toFixed(2);
    if(busy.some(([sd,by])=>(sd===1)===(side===1)&&Math.abs(by-yy)<80))continue;put(k,c,x,yy,sc)}
  return `<g fill="${SH}" opacity=".14">${sh}</g>${o}<path d="${tu}" stroke="${SH}" stroke-opacity=".2" stroke-width="2" stroke-linecap="round" fill="none"/><path d="${d}" fill="none" stroke="${SH}" stroke-opacity=".15" stroke-width="30" stroke-linecap="round" transform="translate(0 5)"/><path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#E2D2B2" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>${fe}<g opacity=".16">${ps}</g>${pr}`}
let html='';
for(let w=0;w<20;w++){const [g]=T[w],pts=[];let nodes='';
  for(let i=0;i<PER;i++){const n=w*PER+i+1,x=+(195+105*Math.sin(i*.62+w*1.3)).toFixed(1),y=H-336-i*72,st=n<CUR?'done':n===CUR?'cur':'lock';pts.push([x,y]);
    nodes+=`<button type="button" class="n ${st}${i===PER-1?' end':''}" style="left:${u(x)};top:${u(y)}" data-n="${n}" aria-label="Level ${n}${st==='cur'?', current':st==='lock'?', locked':''}">${n}${st==='done'?`<span class="st" aria-hidden="true">${'★'.repeat(stars(n))}</span>`:''}${st==='cur'?PIN:''}</button>`}
  const [x0,y0]=pts[0],[xl,yl]=pts[PER-1];let d=`M195 ${H}L195 ${H-200}C195 ${H-280} ${x0} ${y0+60} ${x0} ${y0}`;
  for(let i=1;i<PER;i++){const [a,b]=pts[i-1],[c,e]=pts[i],m=(b+e)/2;d+=`C${a} ${m} ${c} ${m} ${c} ${e}`}d+=`C${xl} ${yl-50} 195 50 195 0`;
  html=`<section class="world" style="background:${g};z-index:${w+1}" data-w="${w}" aria-label="World ${w+1}, ${NAMES[w]}"><svg class="terrain" viewBox="0 0 390 ${H}" aria-hidden="true">${terrain(w,d,pts,i=>Math.sin(i*.62+w*1.3))}</svg>${w?`<svg class="edge" viewBox="0 0 390 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H390V16Q360 34 330 20T270 22T210 16T150 26T90 18T30 24T0 16Z" fill="${SH}" opacity=".15" transform="translate(0 5)"/><path d="M0 0H390V16Q360 34 330 20T270 22T210 16T150 26T90 18T30 24T0 16Z" fill="${g}"/></svg>`:''}<div class="card"><img src="${IMG[w]}" alt="${NAMES[w]} postcard" style="filter:grayscale(${gray(w)})"><span class="tape"></span><span class="stamp" aria-hidden="true">${w+1}</span><span class="tag">${NAMES[w]}</span></div>${nodes}</section>`+html;
}
land.innerHTML=html+'<div class="sketch" id="sketch" aria-hidden="true"></div>';
const cur=land.querySelector('.cur'),secs=[...land.querySelectorAll('.world')];
const fitSketch=()=>{$('sketch').style.height=Math.max(0,cur.getBoundingClientRect().top-land.getBoundingClientRect().top-map.clientWidth/390*30)+'px'};
const toCur=smooth=>map.scrollTo({top:map.scrollTop+cur.getBoundingClientRect().top-map.getBoundingClientRect().top-map.clientHeight*.55,behavior:smooth?'smooth':'auto'});
let tick=0;const onScroll=()=>{if(tick)return;tick=requestAnimationFrame(()=>{tick=0;const r=map.getBoundingClientRect(),mid=r.top+r.height/2,c=cur.getBoundingClientRect();
  for(const s of secs){const b=s.getBoundingClientRect();if(b.top<=mid&&b.bottom>=mid){const w=+s.dataset.w;$('wnum').textContent=w+1;$('wname').textContent=NAMES[w];$('wbar').style.width=(doneIn(w)/PER*100)+'%';break}}
  $('jump').hidden=c.bottom>r.top&&c.top<r.bottom;})};
map.addEventListener('scroll',onScroll);fitSketch();toCur(false);onScroll();
new ResizeObserver(()=>{fitSketch();}).observe(map);
$('jump').onclick=()=>toCur(true);
let opener=null;
land.addEventListener('click',e=>{const b=e.target.closest('.n');if(!b)return;
  if(b.classList.contains('lock')){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
  const n=+b.dataset.n,w=Math.floor((n-1)/PER);opener=b;
  $('simg').src=IMG[w];$('simg').style.filter=`grayscale(${gray(w)})`;$('simg').alt=`${NAMES[w]} postcard`;
  $('sh').textContent=`Level ${n}`;const s=n<CUR?stars(n):0;
  $('sst').hidden=!s;$('sst').innerHTML='★'.repeat(s)+`<i>${'★'.repeat(3-s)}</i>`;
  $('sheet').hidden=false;$('play').focus();});
const close=()=>{$('sheet').hidden=true;opener&&opener.focus()};
$('back').onclick=$('close').onclick=$('play').onclick=close;
$('sheet').addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>

</body></html>
